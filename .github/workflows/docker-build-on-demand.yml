name: Docker Build On Demand

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image name to build (for push), e.g. ghcr.io/owner/repo/wakaama-lwm2m-server"
        required: false
        default: "ghcr.io/owner/repo/wakaama-lwm2m-server"
        type: string
      image_tag:
        description: "Image tag"
        required: false
        default: "manual"
        type: string
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      push:
        description: "Push image to GHCR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push) image
        uses: docker/build-push-action@v6
        with:
          context: ./wakaama-lwm2m-server
          file: ./wakaama-lwm2m-server/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          provenance: false
          sbom: false
